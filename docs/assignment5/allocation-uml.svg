ory</text><line x1="45" y1="498" x2="365" y2="498" stroke="#426079" stroke-width="2"/><text x="57" y="524" font-family="DejaVu Sans" font-size="16" fill="#142332">+ all(): reservations</text><text x="57" y="549" font-family="DejaVu Sans" font-size="16" fill="#142332">+ blockedSpaces()</text><line x1="205" y1="375" x2="205" y2="460" stroke="#426079" stroke-width="2"/><polygon points="205,460 198.91048252244278,447.39374056706254 211.08951747755722,447.39374056706254" fill="#426079" stroke="#426079"/><text x="213.0" y="415.5" font-family="DejaVu Sans" font-size="15" fill="#142332">loads history</text><rect x="440" y="460" width="215" height="90" fill="#f4f7fa" stroke="#426079" stroke-width="2"/><text x="452" y="487" font-family="DejaVu Sans" font-size="19" fill="#142332">FirstFreeAllocation</text><line x1="440" y1="498" x2="655" y2="498" stroke="#426079" stroke-width="2"/><text x="452" y="524" font-family="DejaVu Sans" font-size="16" fill="#142332">smallest ID</text><rect x="690" y="460" width="215" height="90" fill="#f4f7fa" stroke="#426079" stroke-width="2"/><text x="702" y="487" font-family="DejaVu Sans" font-size="19" fill="#142332">NearLiftAllocation</text><line x1="690" y1="498" x2="905" y2="498" stroke="#426079" stroke-width="2"/><text x="702" y="524" font-family="DejaVu Sans" font-size="16" fill="#142332">closest to bay 2</text><rect x="940" y="460" width="215" height="90" fill="#f4f7fa" stroke="#426079" stroke-width="2"/><text x="952" y="487" font-family="DejaVu Sans" font-size="19" fill="#142332">LeastUsedAllocation</text><line x1="940" y1="498" x2="1155" y2="498" stroke="#426079" stroke-width="2"/><text x="952" y="524" font-family="DejaVu Sans" font-size="16" fill="#142332">fewest past uses</text><line x1="547" y1="460" x2="890" y2="390" stroke="#426079" stroke-width="2" stroke-dasharray="7,5"/><polygon points="890,390 878.8659958294313,398.48728172795967 876.4306758537068,386.5542138469101" fill="white" stroke="#426079"/><line x1="797" y1="460" x2="890" y2="390" stroke="#426079" stroke-width="2" stroke-dasharray="7,5"/><polygon points="890,390 883.5900790165464,402.44640160792994 876.2659279133356,392.7157437136642" fill="white" stroke="#426079"/><line x1="1047" y1="460" x2="1047" y2="390" stroke="#426079" stroke-width="2" stroke-dasharray="7,5"/><polygon points="1047,390 1053.0895174775571,402.60625943293746 1040.9104825224429,402.60625943293746" fill="white" stroke="#426079"/><rect x="440" y="650" width="400" height="120" fill="#f4f7fa" stroke="#426079" stroke-width="2"/><text x="452" y="677" font-family="DejaVu Sans" font-size="19" fill="#142332">SpaceAvailability</text><line x1="440" y1="688" x2="840" y2="688" stroke="#426079" stroke-width="2"/><text x="452" y="714" font-family="DejaVu Sans" font-size="16" fill="#142332">freeSpaces: List&lt;Integer&gt;</text><text x="452" y="739" font-family="DejaVu Sans" font-size="16" fill="#142332">previousUses: Map&lt;Integer, Long&gt;</text><line x1="1155" y1="330" x2="1180" y2="330" stroke="#426079" stroke-width="2"/><line x1="1180" y1="330" x2="1180" y2="710" stroke="#426079" stroke-width="2"/><line x1="1180" y1="710" x2="840" y2="710" stroke="#426079" stroke-width="2"/><polygon points="840,710 852.6062594329375,703.9104825224427 852.6062594329375,716.0895174775573" fill="#426079" stroke="#426079"/><text x="900" y="696" font-family="DejaVu Sans" font-size="16" fill="#142332">input snapshot</text><text x="45" y="817" font-family="DejaVu Sans" font-size="17" fill="#142332">Only eligible bays reach the algorithms. Existing reservations remain idempotent during recovery.</text></svg>